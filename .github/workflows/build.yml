# Builds and tests Dictator on Windows and Linux, and uploads the installers as
# artifacts (Actions tab → a run → Artifacts). Nothing is published.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # A short build dir on Windows: whisper.cpp's Vulkan shader build
          # nests deep, and MSBuild fails past 260 characters (FTK1011).
          - os: windows-latest
            target_dir: C:\t
          - os: ubuntu-24.04
            target_dir: ${{ github.workspace }}/src-tauri/target
    runs-on: ${{ matrix.os }}
    env:
      VULKAN_VERSION: 1.4.363.1
      CARGO_TARGET_DIR: ${{ matrix.target_dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-layer-shell-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev \
            libvulkan-dev glslc

      # whisper.cpp's Vulkan backend needs the Vulkan SDK (headers,
      # vulkan-1.lib, glslc). The official LunarG installer, as whisper.cpp's
      # own CI uses; cached, since it's ~300 MB.
      - name: Cache Vulkan SDK
        if: runner.os == 'Windows'
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-${{ env.VULKAN_VERSION }}
      - name: Install Vulkan SDK
        if: runner.os == 'Windows' && steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          curl.exe -fsSL -o "$env:RUNNER_TEMP\vulkan.exe" $url
          & "$env:RUNNER_TEMP\vulkan.exe" --root C:\VulkanSDK --accept-licenses --default-answer --confirm-command install
      - name: Use Vulkan SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path C:\VulkanSDK\Lib\vulkan-1.lib)) { throw "Vulkan SDK install is incomplete" }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\Bin"

      - uses: pnpm/action-setup@v4
        with:
          version: 12 # match the pnpm that wrote pnpm-lock.yaml
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | tee test.log
      - name: Build installers
        shell: bash
        run: |
          set -o pipefail
          pnpm tauri build 2>&1 | tee build.log

      # Job logs need a GitHub login to read, but annotations don't. So post
      # the end of a failing step's output as an annotation, which anyone (or
      # any script) can read from the run page or the API.
      - name: Report failure
        if: failure()
        shell: bash
        run: |
          esc() { sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}'; }
          for f in test.log build.log; do
            [ -f "$f" ] || continue
            # The real error is often buried under build noise (CMake is very
            # chatty), so pull out compiler/linker error lines as well as the tail.
            errors=$(grep -E 'error( |:|\[)|fatal|LNK[0-9]|MSB[0-9]|panicked' "$f" \
              | grep -vE 'warning|-Werror|error_for_status' | head -n 30 | esc)
            [ -n "$errors" ] && echo "::error title=${f} (error lines)::${errors}"
            tail=$(grep -vE '^\s+(Compiling|Downloaded|Checking) |Called from|CMake Warning|policy' "$f" \
              | tail -n 25 | esc)
            echo "::error title=${f} (last lines)::${tail}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dictator-${{ runner.os }}
          path: |
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis/*.exe
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/msi/*.msi
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/deb/*.deb
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/rpm/*.rpm
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

# Builds and tests Dictator on Windows and Linux, and uploads the installers as
# artifacts (Actions tab → a run → Artifacts). Nothing is published.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-layer-shell-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev \
            libvulkan-dev glslc

      # whisper.cpp's Vulkan backend needs the Vulkan headers, loader and glslc.
      - name: Vulkan SDK
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: latest
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 12 # match the pnpm that wrote pnpm-lock.yaml
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build installers
        run: pnpm tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: dictator-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

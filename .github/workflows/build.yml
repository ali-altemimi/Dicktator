# Builds and tests Dictator on Windows and Linux, and uploads the installers as
# artifacts (Actions tab → a run → Artifacts). Nothing is published.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-layer-shell-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev \
            libvulkan-dev glslc

      # whisper.cpp's Vulkan backend needs the Vulkan headers, loader and glslc.
      - name: Vulkan SDK
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: latest
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 12 # match the pnpm that wrote pnpm-lock.yaml
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | tee test.log
      - name: Build installers
        shell: bash
        run: |
          set -o pipefail
          pnpm tauri build 2>&1 | tee build.log

      # Job logs need a GitHub login to read, but annotations don't. So post
      # the end of a failing step's output as an annotation, which anyone (or
      # any script) can read from the run page or the API.
      - name: Report failure
        if: failure()
        shell: bash
        run: |
          for f in test.log build.log; do
            [ -f "$f" ] || continue
            body=$(grep -vE '^\s+(Compiling|Downloaded|Checking) ' "$f" | tail -n 40 \
              | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=${f} (last 40 lines)::${body}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dictator-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
